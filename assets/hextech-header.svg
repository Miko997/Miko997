<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">Miko Parkkinen — Simulation, robotics and systems engineering</title><desc id="desc">Independent research, open source and real-time systems. Violet and blue technical identity.</desc>
<defs>
  <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#29213c"/><stop offset="1" stop-color="#258edf"/></linearGradient>
  <linearGradient id="energy" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ac6cff"/><stop offset=".55" stop-color="#7955ff"/><stop offset="1" stop-color="#50c4ff"/></linearGradient>
  <linearGradient id="flame" x1="0" x2=".6" y1="0" y2="1"><stop stop-color="#d5bbff"/><stop offset=".35" stop-color="#a166ff"/><stop offset=".73" stop-color="#6d5bff"/><stop offset="1" stop-color="#42bdff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#513183" stop-opacity=".38"/><stop offset="1" stop-color="#0b0916" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px}
      @keyframes breathe {0%,100%{opacity:.52}50%{opacity:.95}}
      @keyframes flame {0%,100%{transform:scale(.97,1);opacity:.87}50%{transform:scale(1.04,1.05);opacity:1}}
      @keyframes flow {to{stroke-dashoffset:-360}}
      .pulse{animation:breathe 5s ease-in-out infinite}
      .fire{animation:flame 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
      .orbit{animation:flow 28s linear infinite}
      @media(prefers-reduced-motion:reduce){.pulse,.fire,.orbit{animation:none!important}}
    </style>
</defs>
<rect x="1" y="1" width="1198" height="278" rx="18" fill="#090912" stroke="url(#edge)"/>
<ellipse cx="983.9999999999999" cy="98.0" rx="420.0" ry="196.0" fill="url(#aura)"/>
<path d="M42 34h28m-28 0v22M1158 246h-28m28 0v-22" fill="none" stroke="#5a4a8f" stroke-width="2"/><text x="52" y="67" fill="#a77bff" font-size="16" font-weight="600" text-anchor="start" class="mono">SIMULATION / ROBOTICS / PHYSICAL AI</text><text x="48" y="131" fill="#f1f0ff" font-size="56" font-weight="700" text-anchor="start" >MIKO PARKKINEN</text><text x="52" y="170" fill="#aaa7c4" font-size="22" font-weight="400" text-anchor="start" >Software systems. Independent research. Open source.</text><path d="M52 200h620" stroke="url(#energy)" stroke-width="2"/><text x="52" y="235" fill="#55b9ff" font-size="16" font-weight="500" text-anchor="start" class="mono">BUILD  /  SIMULATE  /  VERIFY</text><circle cx="992" cy="140" r="72" fill="none" stroke="#3c2c65" stroke-width="1"/><circle cx="992" cy="140" r="108" fill="none" stroke="#3c2c65" stroke-width="1"/><circle class="orbit" cx="992" cy="140" r="108" fill="none" stroke="url(#energy)" stroke-width="2" stroke-dasharray="44 128 8 110"/><path d="M992 140L1085.5 86.0" stroke="#31244f"/><circle class="pulse" cx="1085.5" cy="86.0" r="3.5" fill="#a77bff" style="animation-delay:-0s"/><path d="M992 140L1085.5 194.0" stroke="#31244f"/><circle class="pulse" cx="1085.5" cy="194.0" r="3.5" fill="#55b9ff" style="animation-delay:-1s"/><path d="M992 140L992.0 248.0" stroke="#31244f"/><circle class="pulse" cx="992.0" cy="248.0" r="3.5" fill="#a77bff" style="animation-delay:-2s"/><path d="M992 140L898.5 194.0" stroke="#31244f"/><circle class="pulse" cx="898.5" cy="194.0" r="3.5" fill="#55b9ff" style="animation-delay:-3s"/><path d="M992 140L898.5 86.0" stroke="#31244f"/><circle class="pulse" cx="898.5" cy="86.0" r="3.5" fill="#a77bff" style="animation-delay:-4s"/><path d="M992 140L992.0 32.0" stroke="#31244f"/><circle class="pulse" cx="992.0" cy="32.0" r="3.5" fill="#55b9ff" style="animation-delay:-5s"/><path d="M992 83l32 35-7 62-25 24-25-24-7-62zM992 83v121m-32-86 32 19 32-19m-57 62 25-43 25 43" fill="#1b1535" stroke="url(#energy)" stroke-width="2"/><path class="pulse" d="M992 88v110" stroke="#b195ff" stroke-width="5" filter="url(#glow)"/></svg>